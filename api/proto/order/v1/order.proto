syntax = "proto3";

package order.v1;

option go_package = "github.com/artlink52/marketplace/gen/go/order/v1;orderv1";

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";


message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  common.v1.Money unit_price = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_RESERVED = 2;
  ORDER_STATUS_CONFIRMED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_OUT_OF_STOCK = 1;
  CANCEL_REASON_PAYMENT_FAILED = 2;
  CANCEL_REASON_TIMEOUT = 3;
}

message Order {
  string id = 1;
  string user_id = 2;
  OrderStatus status = 3;
  repeated OrderItem items = 4;
  common.v1.Money total_amount = 5;
  CancelReason cancel_reason = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message RequestedItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  string user_id = 1;
  repeated RequestedItem items = 2;
  string idempotency_key = 3;
}

message CreateOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
}