services:
  # ---------- databases ----------
  user-db:
    image: postgres:16-alpine
    container_name: marketplace-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog-db:
    image: postgres:16-alpine
    container_name: marketplace-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: ${CATALOG_DB_NAME}
    ports:
      - "${CATALOG_DB_PORT}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:16-alpine
    container_name: marketplace-order-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- services ----------
  user-service:
    build:
      context: .
      dockerfile: internal/cmd/user/Dockerfile
    container_name: marketplace-user-service
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      USER_DATABASE_DSN: postgres://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME}?sslmode=disable
      USER_PORT: ${USER_PORT}
      USER_TIMEOUT: ${USER_TIMEOUT:-10s}
    ports:
      - "${USER_PORT}:${USER_PORT}"

  catalog-service:
    build:
      context: .
      dockerfile: internal/cmd/catalog/Dockerfile
    container_name: marketplace-catalog-service
    restart: unless-stopped
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      CATALOG_DATABASE_DSN: postgres://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-db:5432/${CATALOG_DB_NAME}?sslmode=disable
      CATALOG_PORT: ${CATALOG_PORT}
      CATALOG_TIMEOUT: ${CATALOG_TIMEOUT:-10s}
    ports:
      - "${CATALOG_PORT}:${CATALOG_PORT}"

  gateway:
    build:
      context: .
      dockerfile: internal/cmd/gateway/Dockerfile
    container_name: marketplace-gateway
    restart: unless-stopped
    depends_on:
      - user-service
      - catalog-service
    environment:
      GATEWAY_HTTP_PORT: ${GATEWAY_HTTP_PORT}
      GATEWAY_HTTP_TIMEOUT: ${GATEWAY_HTTP_TIMEOUT:-5s}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
      GATEWAY_JWT_TTL: ${GATEWAY_JWT_TTL:-24h}
      GATEWAY_USER_SERVICE_ADDR: user-service:${USER_PORT}
      GATEWAY_USER_SERVICE_TIMEOUT: ${GATEWAY_USER_SERVICE_TIMEOUT:-3s}
      GATEWAY_CATALOG_SERVICE_ADDR: catalog-service:${CATALOG_PORT}
      GATEWAY_CATALOG_SERVICE_TIMEOUT: ${GATEWAY_CATALOG_SERVICE_TIMEOUT:-3s}
    ports:
      - "${GATEWAY_HTTP_PORT}:${GATEWAY_HTTP_PORT}"

volumes:
  user_db_data:
  catalog_db_data:
  order_db_data:
