version: "2"

sql:
  # user
  - engine: "postgresql"
    queries: "internal/user/repository/queries"
    schema: "internal/user/migrations"
    gen:
      go:
        package: "dbuser"
        out: "internal/user/repository/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"

  # order
  - engine: "postgresql"
    queries: "internal/order/repository/queries"
    schema: "internal/order/migrations"
    gen:
      go:
        package: "dborder"
        out: "internal/order/repository/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

  # catalog
  - engine: "postgresql"
    queries: "internal/catalog/repository/queries"
    schema: "internal/catalog/migrations"
    gen:
      go:
        package: "dbcatalog"
        out: "internal/catalog/repository/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
