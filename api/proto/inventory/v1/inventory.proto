syntax = "proto3";

package inventory.v1;

option go_package = "github.com/artlink52/marketplace/gen/go/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";


message StockItem {
  string product_id = 1;
  int32 available_qty = 2;
  int32 reserved_qty = 3;
}

message ReservationItem {
  string product_id = 1;
  int32 quantity = 2;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_COMMITTED = 2;
  RESERVATION_STATUS_RELEASED = 3;
  RESERVATION_STATUS_EXPIRED = 4;
}

message Reservation {
  string id = 1;
  string order_id = 2;
  ReservationStatus status = 3;
  repeated ReservationItem items = 4;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expired_at = 8;
}

