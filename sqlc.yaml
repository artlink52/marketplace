version: "2"

sql:
  - engine: "postgresql"
    queries: "internal/user.go/repository/queries"
    schema: "internal/user.go/migrations"
    gen:
      go:
        package: "dbuser"
        out: "internal/user.go/repository/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
