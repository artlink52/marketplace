syntax = "proto3";

package catalog.v1;

option go_package = "github.com/artlink52/marketplace/gen/go/catalog/v1;catalogv1";

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

message Category {
  string id = 1;
  string name = 2;
  string slug = 3;
  repeated Category subcategories = 4;
  optional string parent_id = 5;
}

message CreateCategoryRequest {
  string name = 1;
  string slug = 2;
  optional string parent_id = 3;
}

message CreateCategoryResponse {
  Category category = 1;
}

message Product {
  string id = 1;
  string seller_id = 2;
  string title = 3;
  optional string description = 4;
  string category_id = 5;
  common.v1.Money price = 6;
  ProductStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateProductRequest {
  string seller_id = 1;
  string title = 2;
  string description = 3;
  string category_id = 4;
  common.v1.Money price = 5;
}

message CreateProductResponse {
  string product_id = 1;
}

message UpdateProductRequest {
  string product_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional common.v1.Money price = 4;
}

message UpdateProductResponse {
  Product product = 1;
}

message ArchiveProductRequest {
  string product_id = 1;
}

message ArchiveProductResponse{
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  string category_id = 1;
  string seller_id = 2;
  common.v1.PageRequest page = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  common.v1.PageResponse page = 2;
}

message BatchGetProductsRequest {
  repeated string product_ids = 1;
}

message BatchGetProductsResponse {
  repeated Product products = 1;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

service CatalogService {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
  rpc ArchiveProduct (ArchiveProductRequest) returns (ArchiveProductResponse);
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc BatchGetProducts (BatchGetProductsRequest) returns (BatchGetProductsResponse);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc CreateCategory (CreateCategoryRequest) returns (CreateCategoryResponse);
}
