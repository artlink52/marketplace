services:
  user-db:
    image: postgres:16-alpine
    container_name: marketplace-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: internal/cmd/user/Dockerfile
    container_name: marketplace-user-service
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    env_file: .env
    environment:
      USER_DATABASE_DSN: postgres://${USER_DB_USER}:${USER_DB_PASSWORD}@user-db:5432/${USER_DB_NAME}?sslmode=disable
    ports:
      - "${USER_PORT}:${USER_PORT}"

  gateway:
    build:
      context: .
      dockerfile: internal/cmd/gateway/Dockerfile
    container_name: marketplace-gateway
    restart: unless-stopped
    depends_on:
      - user-service
    env_file: .env
    environment:
      GATEWAY_USER_SERVICE_ADDR: user-service:${USER_PORT}
    ports:
      - "${GATEWAY_HTTP_PORT}:${GATEWAY_HTTP_PORT}"

volumes:
  user_db_data:
